# Kiosk Satellite installs the plugin from this repository's latest release: its manifest, ZIP
# and checksum must be attached by GitHub Actions (tag vX.Y.Z = plugin version X.Y.Z).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  kiosk-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the plugin
        run: docker build --target plugin-out --build-arg PLUGIN_VERSION="${GITHUB_REF_NAME#v}" --output dist .
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json --clobber
