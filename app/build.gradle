plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hkfuertes.shairport'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hkfuertes.shairport'
        minSdk 27 // AAudio is reliable from 8.1 (Oboe uses it from there)
        targetSdk 35
        versionCode 3
        versionName '0.1.2'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // ponytail: debug key, so it upgrades a debug install and keeps ANDROID_ID (the AirPlay
            // device ID). A real key when the APK is published.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs('../build/jniLibs') // from the Dockerfile (make / make jnilibs)
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
