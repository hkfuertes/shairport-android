plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hkfuertes.shairport'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hkfuertes.shairport'
        minSdk 27 // AAudio is reliable from 8.1 (Oboe uses it from there)
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs('../build/jniLibs') // from the Dockerfile (make / make jnilibs)
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
